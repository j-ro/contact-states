bioguide: state_de_gov_john_carney
contact_form:
  method: post
  action: "/wp-content/forms/govContact.php"
  steps:
    - visit: "https://governor.delaware.gov/contact/submit-a-comment-or-request-help/"
    - wait:
        - value: 1
    - fill_in:
        - name: name
          selector: "#name"
          value: $NAME_FULL
          required: true
        - name: email
          selector: "#email"
          value: $EMAIL
          required: true
        - name: phone
          selector: "#phone"
          value: $PHONE
          required: true
        - name: subject
          selector: "#subject"
          value: $SUBJECT
          required: true
        - name: message
          selector: "#message"
          value: $MESSAGE
          required: true
    - wait:
        - value: 5
    - javascript:
        - value: "(function(){ var dups = document.querySelectorAll('[id=\"g-recaptcha-response\"], [name=\"g-recaptcha-response\"]'); for (var i = 0; i < dups.length; i++) { if (!dups[i].form || dups[i].form.id !== 'govContactForm') { dups[i].parentNode.removeChild(dups[i]); } } })()"
    - javascript:
        - value: "(function(){ var el = document.querySelector('#govContactForm #g-recaptcha-response'); if (!el) { el = document.createElement('textarea'); el.id = 'g-recaptcha-response'; el.name = 'g-recaptcha-response'; document.querySelector('#govContactForm').appendChild(el); } el.style.cssText = 'display: block; width: 250px; height: 40px;'; })()"
    - recaptcha:
        - value: true
    - wait:
        - value: 3
    - find:
        - selector: "#govContactSubmit"
    - javascript:
        - value: "document.querySelector('#govContactSubmit').click();"
    - wait:
        - value: 3
  success:
    headers:
      status: 200
    body:
      contains: Thank you
