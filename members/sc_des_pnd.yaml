bioguide: sc_des_pnd #TODO: use naming convention to rename each new file
contact_form:
  method: POST
  action: "https://epermitting.des.sc.gov/ext/ncore/external/publicnotice/info/-5546329374364218921/comments"
  steps:
    - visit: "https://epermitting.des.sc.gov/ext/ncore/external/publicnotice/info/-5546329374364218921/comments"
    - find:
        - selector: "#form-heading"
    - fill_in:
        - name: Name
          selector: "#id='wndField654374658702666'"
          value: $NAME_FULL
          required: true
        - name: Email
          selector: "#id='wndField230165559133243'"
          value: $EMAIL
          required: true
        - name: comments
          selector: "#id='wndField246145388079941'"
          value: $MESSAGE
          required: true
          options:
            max_length: 4000
    - select:
        - name: notificationPreferenceId
          selector: "#Select...: E-Mail"
          value: 'Email'
          required: true
    - click_on:
        - selector: "#save()"
    - recaptcha:
        - value: true
    - wait:
        - value: 3 
  success:
    headers:
      status: 200
    body:
      contains: "Thank you, your comments have been received."