bioguide: SWe00028
contact_form:
  method: post
  action: "https://forms.indigov.com/customers/californiagovernor/contact"
  steps:
    - visit: "https://forms.indigov.com/customers/californiagovernor/contact"
    - javascript:
        - value: Array.prototype.forEach.call(document.querySelectorAll('style,[rel=\"stylesheet\"],[type=\"text/css\"]'), function(element){ try{ element.parentNode.removeChild(element) } catch(err){} });
    - find:
        - selector: "#topic"
          options:
            wait: 20
    - click_on:
        - selector: "#topic"
    - fill_in:
        - name: topic-search
          selector: "#react-select-2-input"
          value: "OTHER"
          required: true
    - find:
        - selector: "[id*='-option-']"
          options:
            wait: 20
    - click_on:
        - selector: "[id*='-option-']"
    - click_on:
        - selector: input[name='Leave a Comment']
    - find:
        - selector: "button:not([disabled])"
          options:
            wait: 20
    - click_on:
        - selector: "button:not([disabled])"
    - find:
        - selector: "#message"
          options:
            wait: 20
    - fill_in:
        - name: message
          selector: "#message"
          value: $MESSAGE
          required: true
    - find:
        - selector: "button:not([disabled])"
          options:
            wait: 20
    - click_on:
        - selector: "button:not([disabled])"
    - find:
        - selector: "#firstName"
          options:
            wait: 20
    - fill_in:
        - name: firstName
          selector: "#firstName"
          value: $NAME_FIRST
          required: true
        - name: lastName
          selector: "#lastName"
          value: $NAME_LAST
          required: true
        - name: email
          selector: "#email"
          value: $EMAIL
          required: true
    - click_on:
        - selector: button[type='submit']
    - wait:
        - value: 5
  success:
    headers:
      status: 200
    body:
      contains: You have successfully sent
